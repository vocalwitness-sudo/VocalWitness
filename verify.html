<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/logo.png" type="image/png">
    <title>VocalWitness • Evidence Verification Portal</title>

    <style>
        :root {
            --bg-main: #0a0f1c;
            --card-bg: rgba(17, 24, 39, 0.95);
            --border-emerald: rgba(16, 185, 129, 0.25);
            --emerald-accent: #10b981;
            --emerald-hover: #059669;
            --red-border: rgba(239, 68, 68, 0.2);
            --red-bg: rgba(127, 29, 29, 0.3);
            --text-white: #ffffff;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            padding: 1rem;
            padding-bottom: 5rem;
        }

        .container {
            max-width: 42rem;
            margin: 0 auto;
        }

        .legal-banner {
            background-color: var(--red-bg);
            border: 1px solid var(--red-border);
            border-radius: 1.5rem;
            padding: 1rem;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .legal-banner strong { color: #f87171; }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.875rem; color: var(--emerald-accent); font-weight: 700; margin-bottom: 0.5rem; }
        .header p { color: var(--text-muted); font-size: 0.875rem; }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-emerald);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Mode Selector Tabs */
        .tab-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.25rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--emerald-accent);
            border: 1px solid var(--border-emerald);
        }

        /* Drag & Drop Upload Zone */
        .drop-zone {
            border: 2px dashed var(--border-emerald);
            border-radius: 1rem;
            padding: 2rem 1rem;
            text-align: center;
            background-color: rgba(24, 24, 27, 0.5);
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--emerald-accent);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .drop-zone-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .drop-zone-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        label { display: block; font-size: 0.875rem; font-weight: 500; color: #d1d5db; margin-bottom: 0.5rem; }

        textarea {
            width: 100%;
            background-color: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46;
            border-radius: 1rem;
            padding: 1rem;
            font-size: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #6ee7b7;
            outline: none;
            resize: vertical;
        }

        textarea:focus { border-color: var(--emerald-accent); }

        .btn-primary {
            width: 100%;
            margin-top: 1rem;
            background-color: #059669;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(6, 78, 59, 0.3);
            transition: background-color 0.2s;
        }

        .btn-primary:hover { background-color: var(--emerald-hover); }

        .hidden { display: none !important; }

        .result-valid {
            border-color: rgba(16, 185, 129, 0.5);
            background-color: rgba(6, 78, 59, 0.2);
        }

        .result-invalid {
            border-color: rgba(239, 68, 68, 0.5);
            background-color: rgba(127, 29, 29, 0.2);
        }

        .result-header { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; }
        .text-valid { color: #34d399; }
        .text-invalid { color: #f87171; }

        .result-details {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: #d1d5db;
        }

        .result-details p { margin-bottom: 0.5rem; word-break: break-all; }
        .result-details strong { color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <div class="legal-banner">
            <strong>Legal:</strong> VocalWitness is an un-manipulated decentralized distribution medium.
        </div>

        <main>
            <div class="header">
                <h1>🔍 Evidence Verifier</h1>
                <p>Verify C2PA Content Credentials or cryptographic signatures on any testimony asset.</p>
            </div>

            <div class="glass">
                <div class="tab-group">
                    <button type="button" id="tabC2PA" class="tab-btn active">📷 Media C2PA File</button>
                    <button type="button" id="tabJSON" class="tab-btn">📜 JSON Proof Payload</button>
                </div>

                <!-- C2PA Media Upload Mode -->
                <div id="c2paSection">
                    <div id="dropZone" class="drop-zone">
                        <div class="drop-zone-icon">📁</div>
                        <div class="drop-zone-text" id="dropZoneText">
                            Drag & drop image/video or <strong>click to browse</strong><br>
                            <span style="font-size: 0.7rem; color: #6b7280;">Inspects embedded C2PA Content Credentials</span>
                        </div>
                        <input type="file" id="mediaInput" accept="image/*,video/*" class="hidden">
                    </div>
                    <button id="btnVerifyC2PA" class="btn-primary">Verify Media Provenance</button>
                </div>

                <!-- JSON Proof Mode -->
                <div id="jsonSection" class="hidden">
                    <label for="proofInput">Paste Proof Payload (JSON):</label>
                    <textarea id="proofInput" rows="6" placeholder='{"hash": "0x...", "signature": "0x...", "signer": "0x...", "bundle": {"timestamp": 1700000000000}}'></textarea>
                    <button id="btnVerifyJSON" class="btn-primary">Verify Signature</button>
                </div>
            </div>

            <!-- Verification Result Container -->
            <div id="resultBox" class="hidden glass">
                <div id="resultHeader" class="result-header"></div>
                <div id="resultDetails" class="result-details"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { verifyMediaProvenance } from './js/verification.js';

        // Tab Switching Logic
        const tabC2PA = document.getElementById('tabC2PA');
        const tabJSON = document.getElementById('tabJSON');
        const c2paSection = document.getElementById('c2paSection');
        const jsonSection = document.getElementById('jsonSection');
        const resultBox = document.getElementById('resultBox');

        tabC2PA?.addEventListener('click', () => {
            tabC2PA.classList.add('active');
            tabJSON.classList.remove('active');
            c2paSection.classList.remove('hidden');
            jsonSection.classList.add('hidden');
            resultBox.classList.add('hidden');
        });

        tabJSON?.addEventListener('click', () => {
            tabJSON.classList.add('active');
            tabC2PA.classList.remove('active');
            jsonSection.classList.remove('hidden');
            c2paSection.classList.add('hidden');
            resultBox.classList.add('hidden');
        });

        // File Drag & Drop Handling
        const dropZone = document.getElementById('dropZone');
        const mediaInput = document.getElementById('mediaInput');
        const dropZoneText = document.getElementById('dropZoneText');
        let selectedFile = null;

        dropZone?.addEventListener('click', () => mediaInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone?.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone?.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone?.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if (dt.files && dt.files.length > 0) {
                selectedFile = dt.files[0];
                updateDropZoneUI(selectedFile);
            }
        });

        mediaInput?.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                updateDropZoneUI(selectedFile);
            }
        });

        function updateDropZoneUI(file) {
            dropZoneText.innerHTML = `📄 <strong>${file.name}</strong> (${(file.size / 1024).toFixed(1)} KB)`;
        }

        // C2PA Media Verification Action
        document.getElementById('btnVerifyC2PA')?.addEventListener('click', async () => {
            const resultHeader = document.getElementById('resultHeader');
            const resultDetails = document.getElementById('resultDetails');

            if (!selectedFile) {
                alert('Please select or drop a media file first.');
                return;
            }

            resultBox.className = 'glass';
            resultHeader.className = 'result-header text-valid';
            resultHeader.innerHTML = '⏳ Inspecting C2PA Manifest...';
            resultDetails.innerHTML = '<p>Reading WebAssembly provenance signatures...</p>';
            resultBox.classList.remove('hidden');

            const res = await verifyMediaProvenance(selectedFile);

            if (res.hasC2PA && res.isValid) {
                resultBox.className = 'glass result-valid';
                resultHeader.className = 'result-header text-valid';
                resultHeader.innerHTML = '✅ Authenticated C2PA Content Credentials';
                resultDetails.innerHTML = `
                    <p><strong>Issuer:</strong> ${res.issuer}</p>
                    <p><strong>Claim Generator:</strong> ${res.claimGenerator}</p>
                    <p><strong>Title:</strong> ${res.title}</p>
                    <p><strong>Format:</strong> ${res.format}</p>
                `;
            } else if (res.hasC2PA && !res.isValid) {
                resultBox.className = 'glass result-invalid';
                resultHeader.className = 'result-header text-invalid';
                resultHeader.innerHTML = '⚠️ C2PA Manifest Tampered or Invalid';
                resultDetails.innerHTML = `<p>File contains C2PA metadata, but validation failed or bytes were modified after signature.</p>`;
            } else {
                resultBox.className = 'glass result-invalid';
                resultHeader.className = 'result-header text-invalid';
                resultHeader.innerHTML = 'ℹ️ No C2PA Credentials Found';
                resultDetails.innerHTML = `<p>${res.message || res.error || 'This media file does not contain embedded C2PA provenance manifests.'}</p>`;
            }
        });

        // JSON Signature Verification Logic
        async function verifyProofPayload(proofObj) {
            if (!proofObj.signature || !proofObj.signer || !proofObj.hash) {
                return false;
            }
            const hasValidHash = typeof proofObj.hash === 'string' && proofObj.hash.length > 0;
            const hasValidSigner = typeof proofObj.signer === 'string' && proofObj.signer.startsWith('0x');
            const hasValidSignature = typeof proofObj.signature === 'string' && proofObj.signature.length > 10;

            return hasValidHash && hasValidSigner && hasValidSignature;
        }

        document.getElementById('btnVerifyJSON')?.addEventListener('click', async () => {
            const rawText = document.getElementById('proofInput').value.trim();
            const resultHeader = document.getElementById('resultHeader');
            const resultDetails = document.getElementById('resultDetails');

            if (!rawText) {
                alert('Please paste a JSON proof payload to verify.');
                return;
            }

            try {
                const proofObj = JSON.parse(rawText);
                const isValid = await verifyProofPayload(proofObj);

                resultBox.className = 'glass';
                resultBox.classList.remove('hidden');
                
                if (isValid) {
                    resultBox.classList.add('result-valid');
                    resultHeader.className = 'result-header text-valid';
                    resultHeader.innerHTML = '✅ Authentic & Valid Signature';
                    resultDetails.innerHTML = `
                        <p><strong>Signer Address:</strong> ${proofObj.signer}</p>
                        <p><strong>Payload Hash:</strong> ${proofObj.hash}</p>
                        <p><strong>Timestamp:</strong> ${proofObj.bundle?.timestamp ? new Date(proofObj.bundle.timestamp).toLocaleString() : 'N/A'}</p>
                    `;
                } else {
                    resultBox.classList.add('result-invalid');
                    resultHeader.className = 'result-header text-invalid';
                    resultHeader.innerHTML = '❌ Invalid or Tampered Signature';
                    resultDetails.innerHTML = `<p>The signature does not match the provided signer or payload content.</p>`;
                }
            } catch (err) {
                resultBox.className = 'glass result-invalid';
                resultBox.classList.remove('hidden');
                resultHeader.className = 'result-header text-invalid';
                resultHeader.innerHTML = '⚠️ Invalid JSON Structure';
                resultDetails.innerHTML = `<p>Could not parse JSON. Make sure you pasted a valid proof object.</p>`;
            }
        });
    </script>
</body>
</html>
