<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group • VocalWitness</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./logo.png" type="image/png">
  <style>
    .glass {
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(16, 185, 129, 0.22);
    }
    .tab-btn.active {
      color: #34d399 !important;
      border-bottom: 2px solid #10b981;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0a0f1c] pb-28 text-white">

  <div class="mx-auto max-w-3xl px-4 py-6">

    <!-- Header -->
    <div class="glass mb-6 flex items-center justify-between rounded-3xl p-4">
      <div class="flex items-center gap-3">
        <a href="groups.html" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-500/15 text-lg transition hover:bg-emerald-500/25">←</a>
        <div>
          <h1 id="groupName" class="text-xl font-bold text-emerald-400">Loading…</h1>
          <p class="text-xs text-zinc-400 flex items-center gap-2">
            <span id="memberCount">0 members</span>
            <span id="groupVisibilityBadge" class="rounded-full border px-2.5 py-0.5 text-xs border-emerald-500/40 bg-emerald-500/10 text-emerald-400">Public</span>
          </p>
        </div>
      </div>
      <button id="joinLeaveBtn" class="rounded-2xl bg-emerald-500 px-5 py-2.5 text-sm font-semibold text-black hover:bg-emerald-400">
        Join Group
      </button>
    </div>

    <!-- Description -->
    <div class="glass mb-6 rounded-3xl p-5">
      <p id="groupDescription" class="text-sm text-zinc-300 leading-relaxed">Loading description…</p>
      <p class="mt-3 text-xs text-zinc-500">Created: <span id="groupCreatedAt">—</span></p>
    </div>

    <!-- Tabs -->
    <div class="mb-6 flex gap-1 overflow-x-auto border-b border-zinc-800 pb-1">
      <button class="tab-btn active shrink-0 px-4 py-3 text-sm font-medium text-emerald-400" data-tab="feed">Discussion</button>
      <button class="tab-btn shrink-0 px-4 py-3 text-sm font-medium text-zinc-400" data-tab="locker">🗄️ Locker</button>
      <button class="tab-btn shrink-0 px-4 py-3 text-sm font-medium text-zinc-400" data-tab="attestation">📜 Attestation</button>
      <button class="tab-btn shrink-0 px-4 py-3 text-sm font-medium text-zinc-400" data-tab="timeline">⏱️ Timeline</button>
      <button class="tab-btn shrink-0 px-4 py-3 text-sm font-medium text-zinc-400" data-tab="members">
        Members <span id="pendingBadge" class="hidden ml-1 h-5 w-5 items-center justify-center rounded-full bg-amber-500 text-[10px] text-black">0</span>
      </button>
      <button class="tab-btn shrink-0 px-4 py-3 text-sm font-medium text-zinc-400" data-tab="about">About</button>
    </div>

    <!-- ===================== TAB: FEED ===================== -->
    <div id="tab-feed" class="space-y-5">
      <div class="glass rounded-3xl p-4">
        <textarea id="groupPostInput" rows="3" placeholder="Share something with the group…"
                  class="w-full resize-none rounded-2xl border border-zinc-700 bg-zinc-900 px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none"></textarea>
        <div class="mt-3 flex justify-end">
          <button id="postToGroupBtn" class="rounded-2xl bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-black hover:bg-emerald-500">
            Post
          </button>
        </div>
      </div>
      <div id="groupFeed" class="space-y-4"></div>
    </div>

    <!-- ===================== TAB: EVIDENCE LOCKER ===================== -->
    <div id="tab-locker" class="hidden space-y-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold">Evidence Locker</h3>
        <button id="
