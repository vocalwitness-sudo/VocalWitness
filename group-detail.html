<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups • VocalWitness</title>
  <link rel="icon" href="./logo.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <style>
    .glass {
      background: rgba(13, 18, 30, 0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(16, 185, 129, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .tab-btn.active {
      border: 1px solid rgba(16, 185, 129, 0.6);
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-weight: 700;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen bg-[#070b14] text-white selection:bg-emerald-500 selection:text-black">

  <div class="mx-auto max-w-4xl px-4 py-8">

    <!-- Header -->
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-zinc-800 pb-6">
      <div class="flex items-center gap-4">
        <a href="index.html"
           class="flex h-12 w-12 items-center justify-center rounded-2xl bg-zinc-900 border border-zinc-800 text-xl text-emerald-400 transition hover:bg-emerald-500 hover:text-black hover:border-emerald-500"
           aria-label="Back to home">
          ←
        </a>
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
            Groups
          </h1>
          <p class="mt-1 text-sm text-zinc-400">Discover and join citizen reporting circles</p>
        </div>
      </div>
      <button id="openCreateModalBtn" type="button"
              class="rounded-2xl bg-emerald-500 px-6 py-3 text-sm font-extrabold text-black shadow-lg shadow-emerald-500/25 hover:bg-emerald-400 transition shrink-0">
        + Create Group
      </button>
    </div>

    <!-- Tabs + Search -->
    <div class="mb-6 flex flex-col sm:flex-row gap-3 sm:items-center justify-between">
      <div class="flex gap-2">
        <button type="button" class="tab-btn active rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-2 text-sm text-zinc-300 transition"
                data-tab="discover">
          Discover
        </button>
        <button type="button" class="tab-btn rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-2 text-sm text-zinc-300 transition"
                data-tab="my-groups">
          My Groups
        </button>
      </div>
      <input id="searchInput" type="search" placeholder="Search groups…"
             class="w-full sm:w-64 rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:border-emerald-500 focus:outline-none">
    </div>

    <!-- Group cards container -->
    <div id="group-container" class="space-y-4">
      <!-- Cards injected by js/groups.js -->
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden rounded-3xl border border-dashed border-zinc-700 bg-zinc-900/40 py-16 text-center">
      <div class="mb-3 text-4xl">👥</div>
      <p class="text-zinc-400">No groups found</p>
      <p class="mt-1 text-xs text-zinc-500">Create one or try a different search</p>
    </div>

  </div>

  <!-- ========== CREATE GROUP MODAL ========== -->
  <div id="groupModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
    <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl">
      <div class="mb-5 flex items-center justify-between">
        <h2 class="text-lg font-bold text-white">Create a Group</h2>
        <button id="closeCreateModalBtn" type="button"
                class="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-800 hover:text-white transition">
          ✕
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label for="groupName" class="mb-1.5 block text-xs font-medium text-zinc-400">Group Name *</label>
          <input id="groupName" type="text" maxlength="60" placeholder="e.g. Lagos Traffic Watch"
                 class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white placeholder-zinc-500 focus:border-emerald-500 focus:outline-none">
        </div>

        <div>
          <label for="groupDesc" class="mb-1.5 block text-xs font-medium text-zinc-400">Description</label>
          <textarea id="groupDesc" rows="3" maxlength="280" placeholder="What is this group about?"
                    class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white placeholder-zinc-500 focus:border-emerald-500 focus:outline-none resize-none"></textarea>
        </div>

        <div>
          <label for="groupVisibility" class="mb-1.5 block text-xs font-medium text-zinc-400">Visibility</label>
          <select id="groupVisibility"
                  class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white focus:border-emerald-500 focus:outline-none">
            <option value="public">Public — anyone can join</option>
            <option value="network">Network — discoverable, join with request</option>
            <option value="citizen_circle">Citizen Circle</option>
            <option value="witness_circle">Witness Circle (high trust)</option>
          </select>
        </div>
      </div>

      <div class="mt-6 flex gap-3">
        <button id="closeCreateModalBtn" type="button"
                class="flex-1 rounded-xl border border-zinc-700 bg-zinc-800 px-4 py-3 text-sm font-medium text-zinc-300 hover:bg-zinc-700 transition">
          Cancel
        </button>
        <button id="submitCreateGroupBtn" type="button"
                class="flex-1 rounded-xl bg-emerald-500 px-4 py-3 text-sm font-bold text-black hover:bg-emerald-400 transition">
          Create Group
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initGroups } from './js/groups.js';

    document.addEventListener('DOMContentLoaded', () => {
      initGroups('group-container');
    });
  </script>
</body>
</html>
