<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="publicSquareTitle">Public Square • VocalWitness</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1c; color: #e2e8f0; }
        .glass { background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(16, 185, 129, 0.25); }
    </style>
</head>
<body class="min-h-screen bg-[#0a0f1c]">

    <div class="max-w-3xl mx-auto p-6">
        <header class="flex items-center justify-between mb-10">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center text-2xl">🔊</div>
                    <div>
                        <h1 class="text-2xl font-bold" data-i18n="vocalWitnessBrand">VocalWitness</h1>
                    </div>
                </a>
            </div>
            <a href="my-testimonies.html" class="text-emerald-400 hover:text-emerald-300">My Testimonies →</a>
        </header>

        <!-- Testimony Recording / Creation Box -->
        <div class="glass rounded-3xl p-8 mb-8">
            <h2 class="text-xl font-bold mb-4">Record Your Testimony</h2>
            
            <textarea 
                id="testimonyText"
                rows="4" 
                class="w-full bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-4 text-slate-200 placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
                placeholder="Share your witness..."
            ></textarea>

            <!-- Bottom Action Controls -->
            <div class="flex flex-wrap items-center justify-between gap-4 mt-4 pt-2 border-t border-slate-800">
                
                <!-- PASTE YOUR ANONYMOUS CHECKBOX HERE -->
                <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer select-none">
                    <input type="checkbox" id="post-anonymously" class="rounded border-zinc-600 accent-emerald-500" />
                    <span>Post Anonymously <span class="text-zinc-500">(tier still counts privately if signed in)</span></span>
                </label>

                <!-- Submit Button -->
                <button 
                    id="submitTestimonyBtn"
                    class="bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-semibold px-6 py-2.5 rounded-xl hover:opacity-90 transition-opacity"
                >
                    Publish Testimony
                </button>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="testimoniesFeed" class="space-y-6">
            <!-- Feed items will render here -->
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
