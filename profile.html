<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="myProfileTitle">My Profile | VocalWitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-[#0a0f1c] text-zinc-200">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 p-4 border-b border-zinc-700">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center text-2xl">🔊</div>
                <span class="font-bold text-xl" data-i18n="appTitle">VocalWitness</span>
            </a>
            
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-emerald-400 hover:text-emerald-300" data-i18n="backToSquare">← Back to Square</a>
                <button onclick="toggleDarkMode()" class="p-3 rounded-2xl hover:bg-zinc-800 transition-colors">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-6">
        <div class="glass rounded-3xl overflow-hidden min-h-[600px] flex flex-col">
            <div id="mainProfileContent" class="flex-1 p-8 overflow-y-auto custom-scroll">
                <div class="text-center py-20 text-zinc-400" data-i18n="loadingProfile">Loading your profile...</div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[10000] p-4">
        <div class="glass rounded-3xl p-8 max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-zinc-700 pb-4 flex-shrink-0">
                <h2 class="text-2xl font-bold text-white" data-i18n="myProfile">My Profile</h2>
                <button onclick="closeProfile()" class="text-4xl text-zinc-400 hover:text-white leading-none">×</button>
            </div>
            
            <div id="modalProfileContent" class="flex-1 overflow-y-auto pr-2 custom-scroll">
                <!-- JS will fill this -->
            </div>

            <div class="mt-8 flex gap-3 flex-shrink-0">
                <button onclick="logout()" 
                        class="flex-1 py-3 border border-red-500 text-red-400 hover:bg-red-500/10 rounded-2xl font-medium transition"
                        data-i18n="signOut">
                    Sign Out
                </button>
                <button onclick="openSettings()" 
                        class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl font-medium transition">
                    ⚙️ <span data-i18n="settings">Settings</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initProfile } from './js/profile.js';
        import { initLanguage } from './js/i18n.js';
        import { initDarkMode } from './js/utils.js';

        document.addEventListener('DOMContentLoaded', () => {
            initProfile();
            initLanguage();
            initDarkMode();
        });
    </script>

    <script>
        window.closeProfile = () => {
            document.getElementById('profileModal').classList.add('hidden');
        };

        window.openSettings = () => {
            showToast("Settings panel coming soon", "info");
        };

        window.toggleDarkMode = () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            showToast(next === 'dark' ? '🌙 Dark Mode' : '☀️ Light Mode');
        };
    </script>
</body>
</html>
