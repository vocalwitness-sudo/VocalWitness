<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | VocalWitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-[#0a0f1c] text-zinc-200">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 p-4 border-b border-zinc-700">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center text-2xl">🔊</div>
                <span class="font-bold text-xl">VocalWitness</span>
            </a>
            <a href="index.html" class="text-emerald-400 hover:text-emerald-300">← Back to Square</a>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-6">
        <div id="profileContainer" class="glass rounded-3xl overflow-hidden min-h-[600px] flex flex-col">
            <!-- Dynamic Content -->
            <div id="profileContent" class="flex-1 p-8 overflow-y-auto custom-scroll">
                <div class="text-center py-20 text-zinc-400">Loading your profile...</div>
            </div>
        </div>
    </div>

   <!-- Profile Modal - Improved -->
<div id="profileModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[10000] p-4 overflow-hidden">
    <div class="glass rounded-3xl p-8 max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 border-b border-zinc-700 pb-4 flex-shrink-0">
            <h2 class="text-2xl font-bold text-white">My Profile</h2>
            <button onclick="closeProfile()" 
                    class="text-4xl text-zinc-400 hover:text-white leading-none transition-colors">×</button>
        </div>
        
        <!-- Scrollable Content -->
        <div id="profileContent" class="flex-1 overflow-y-auto pr-2 custom-scroll">
            <!-- Content injected by JS -->
        </div>

        <!-- Footer Actions -->
        <div class="mt-8 flex gap-3 flex-shrink-0">
            <button onclick="logout()" 
                    class="flex-1 py-3 border border-red-500 text-red-400 hover:bg-red-500/10 rounded-2xl font-medium transition">
                Sign Out
            </button>
            <button onclick="openSettings()" 
                    class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl font-medium transition">
                ⚙️ Settings
            </button>
        </div>
    </div>
</div>

    <script type="module">
        import { initProfile } from './js/profile.js';
        import { showToast } from './js/utils.js';   // if needed

        document.addEventListener('DOMContentLoaded', () => {
            initProfile();
        });

        // Global helpers for this page
        window.closeProfile = () => window.history.back(); // or close modal
        window.showToast = showToast || function(msg) { alert(msg); };
    </script>

    <script src="js/main.js"></script>   <!-- This brings in many helpers -->
</body>
</html>
