name: Deploy Live

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Allows manual triggers as well

jobs:
  deploy-live:
    name: Deploy to Production
    # Only run if CI Quality Gates finished with a successful status
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && cd functions && npm ci && cd ..

      - name: Build CSS & Audit i18n
        run: npm run deploy:hosting # Or your specific deploy scripts

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOCALWITNESS_3AFFA }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
