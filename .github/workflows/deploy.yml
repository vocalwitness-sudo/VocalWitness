name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & compile CSS
        run: |
          npm ci || npm install
          cd functions && (npm ci || npm install) && cd ..
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/
