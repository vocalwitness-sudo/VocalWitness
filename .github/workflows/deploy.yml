name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & compile CSS
        run: |
          npm ci || npm install
          cd functions && (npm ci || npm install) && cd ..
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore, Storage & Critical Functions
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: |
          npm install -g firebase-tools@latest
          firebase deploy \
            --only firestore,storage,\
          functions:getUploadUrl,\
          functions:confirmPhoneVerification,\
          functions:initializeCitizenProfile,\
          functions:evaluateTrustTier,\
          functions:setUserClaims,\
          functions:banUser,\
          functions:unbanUser,\
          functions:moderatedDelete,\
          functions:submitTestimonySecure,\
          functions:generateZKProof,\
          functions:registerZKCommitment,\
          functions:onTestimonyReactionWriteV2,\
          functions:paystackWebhook,\
          functions:nowPaymentsWebhook,\
          functions:dailyAnchor,\
          functions:triggerAnchorNow,\
          functions:ogPost \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest
