name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Matched to your package.json engines
          cache: 'npm'      # Speeds up CI by caching dependencies

      - name: Install Dependencies
        run: npm ci         # Strictly installs what is in package-lock.json

      - name: Build Application (Vite + Tailwind + ZK Assets)
        run: npm run build  # Triggers Vite to compile everything to public/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
