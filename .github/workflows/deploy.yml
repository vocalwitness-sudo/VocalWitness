name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & compile CSS
        run: |
          npm ci || npm install
          cd functions && (npm ci || npm install) && cd ..
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase Tools
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore and Storage Rules
        run: |
          firebase deploy \
            --only firestore,storage \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      # Hosting first so frontend changes always go live
      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest

      # =====================================================
      # FUNCTIONS – very small batches to stay under CPU quota
      # =====================================================

      - name: Deploy Functions (Batch 1a - getUploadUrl alone)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:getUploadUrl \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 1b - Phone + Claims)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:confirmPhoneVerification,functions:setUserClaims \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 2a - Ban / Unban)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:banUser,functions:unbanUser \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 2b - Moderation)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:moderatedDelete,functions:restoreHiddenContent \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 3 - Trust Tier)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:evaluateTrustTier \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 4 - AI Tools)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:translateTestimony,functions:transcribeAudioWitness,functions:summarizeReport \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 5 - Payments)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:initializePaystack,functions:paystackWebhook,functions:nowPaymentsWebhook \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 6 - Remaining Core)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "120"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:analyzeToxicity,functions:submitTestimonySecure,functions:initializeCitizenProfile,functions:dailyAnchor,functions:triggerAnchorNow \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 7 - ZK & Advanced)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "120"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:generateZKProof,functions:registerZKCommitment,functions:verifyAndElevateZKProof,functions:detectSyntheticMedia,functions:checkContentConsistency,functions:suggestCorroborations,functions:scoreToxicity \
            --project vocalwitness-3affa \
            --force \
            --non-interactive
