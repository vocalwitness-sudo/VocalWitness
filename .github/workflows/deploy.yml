name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & compile CSS
        run: |
          npm ci || npm install
          cd functions && (npm ci || npm install) && cd ..
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase Tools
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore and Storage Rules
        run: |
          firebase deploy \
            --only firestore,storage \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      # Hosting first so frontend changes always go live
      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest

      # Functions with retry (handles temporary us-central1 unavailability)
      - name: Deploy Functions (with retry)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          echo "Attempting functions deploy..."
          
          for i in 1 2 3; do
            echo "=== Attempt $i of 3 ==="
            if firebase deploy \
              --only functions \
              --project vocalwitness-3affa \
              --force \
              --non-interactive; then
              echo "Functions deployed successfully on attempt $i"
              exit 0
            fi
            
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed. Waiting 90 seconds before retry..."
              sleep 90
            fi
          done
          
          echo "All 3 attempts failed (temporary region issue)."
          echo "Frontend was still deployed successfully."
          exit 1
