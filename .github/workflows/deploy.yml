name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & compile CSS
        run: |
          # Force clean lockfiles so npm ci never fails again
          rm -f package-lock.json
          npm install --package-lock-only
          npm install

          cd functions
          rm -f package-lock.json
          npm install --package-lock-only
          npm install
          cd ..

          # Build CSS
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase Tools
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore and Storage Rules
        run: |
          firebase deploy \
            --only firestore,storage \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      # Hosting first so frontend always goes live
      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest

      # ========== FUNCTIONS IN SMALL BATCHES ==========
      # Use only the real export names (never the create* factory names)

      - name: Deploy Functions (Batch 1 - Core Callables)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:getUploadUrl,functions:confirmPhoneVerification,functions:setUserClaims \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 2 - Moderation & Trust)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:banUser,functions:unbanUser,functions:moderatedDelete,functions:evaluateTrustTier,functions:restoreHiddenContent \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      # Paystack in its own tiny batch (avoids CPU quota spike)
      - name: Deploy Functions (Batch 3 - Paystack)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "90"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:initializePaystack,functions:paystackWebhook \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions (Batch 4 - Remaining Services & Tasks)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "120"
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
        run: |
          firebase deploy \
            --only functions:analyzeToxicity,functions:translateTestimony,functions:transcribeAudioWitness,functions:summarizeReport,functions:nowPaymentsWebhook,functions:verifyAndElevateZKProof,functions:detectSyntheticMedia,functions:checkContentConsistency,functions:suggestCorroborations,functions:scoreToxicity,functions:requestTimestamp,functions:getLiveKitToken,functions:registerZKCommitment,functions:castDaoVote,functions:generateZKProof,functions:submitTestimonySecure,functions:onTestimonyReactionWriteV2,functions:getPresignedUrl,functions:verifyAndTimestampMedia,functions:heavyProcessingTask,functions:ogPost,functions:dailyAnchor,functions:triggerAnchorNow,functions:initializeCitizenProfile \
            --project vocalwitness-3affa \
            --force \
            --non-interactive
