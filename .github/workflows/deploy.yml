Here is your complete workflow file with the fixes applied.

Two critical adjustments were made based on your build failure:

1. Changed **`npm ci`** to **`npm install`** so it won't crash if your lockfile has minor discrepancies.


2. Changed **`15.33.0`** to **`latest`** for the Firebase CLI tools, because version 15 does not exist yet (current stable versions are in the `13.x` range).

```yaml
name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    # environment: production   # uncomment when you want protection rules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production CSS
        run: npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore + Storage + Functions
        run: |
          firebase deploy \
            --only firestore,storage,functions \
            --project vocalwitness-3affa \
            --non-interactive \
            --force

      - name: Deploy Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest

```
