name: Deploy Live

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    name: Deploy to Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd functions && npm ci && cd ..

      - name: Build for Production
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy Critical Cloud Functions
        run: |
          firebase deploy \
            --only functions:onTestimonyReactionWrite,functions:submitTestimonySecure,functions:moderatePostContent,functions:setUserClaims,functions:confirmPhoneVerification,functions:getUploadUrl \
            --project vocalwitness-3affa \
            --force \
            --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
