name: Deploy to Production (Live)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    # Optional: enable after creating GitHub Environment "production"
    # environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Build production CSS
        run: npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      # Required: functions has its own package.json / node_modules
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase Tools
        run: npm install -g firebase-tools@13.29.1

      - name: Deploy Firestore Rules + Indexes
        run: firebase deploy --only firestore --project vocalwitness-3affa --non-interactive

      - name: Deploy Storage Rules
        run: firebase deploy --only storage --project vocalwitness-3affa --non-interactive

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project vocalwitness-3affa --non-interactive

      - name: Deploy Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: 13.29.1
