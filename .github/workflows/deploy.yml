name: Deploy to Production (Live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & compile CSS
        run: |
          npm ci || npm install
          cd functions && (npm ci || npm install) && cd ..
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore and Storage Rules
        run: |
          npm install -g firebase-tools@latest
          firebase deploy \
            --only firestore,storage \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions Batch 1 (Security, ZK Proofs & Media Uploads)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: |
          firebase deploy \
            --only functions:submitTestimonySecure,functions:generateZKProof,functions:verifyAndTimestampMedia,functions:getUploadUrl,functions:getPresignedUrl,functions:verifyAndElevateZKProof,functions:registerZKCommitment \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions Batch 2 (Governance, Moderation & DAO)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: |
          firebase deploy \
            --only functions:analyzeToxicity,functions:scoreToxicity,functions:banUser,functions:unbanUser,functions:castDaoVote,functions:evaluateTrustTier,functions:moderatedDelete,functions:restoreHiddenContent,functions:setUserClaims \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Functions Batch 3 (Webhooks, Payments & News)
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: |
          firebase deploy \
            --only functions:paystackWebhook,functions:initializePaystack,functions:nowPaymentsWebhook,functions:dailyAnchor,functions:triggerAnchorNow,functions:getCuratedNews,functions:warmCuratedNews,functions:tickerHeadlines \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy Remaining Functions & Complete Function Sweep
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: |
          firebase deploy \
            --only functions \
            --project vocalwitness-3affa \
            --force \
            --non-interactive

      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: vocalwitness-3affa
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest
