name: CI Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci || npm install
          if [ -f functions/package.json ]; then
            cd functions
            npm ci || npm install
            cd ..
          fi

      - name: Syntax check (must pass)
        run: node scripts/syntax-check.mjs

      - name: Integrity core (must pass)
        run: node tests/integrity-core.js

      - name: Media integrity (must pass)
        run: node tests/media-integrity.test.js

      - name: Firestore rules integrity gate (must pass)
        run: node tests/firestore-rules.test.js

      - name: ESLint (warn only for now)
        run: npx eslint js functions --no-error-on-unmatched-pattern
        continue-on-error: true

      - name: Build (must pass)
        run: npm run build
