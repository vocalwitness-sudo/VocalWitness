name: CI - Lint + Integrity + Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run ESLint
        run: npx eslint js functions --no-error-on-unmatched-pattern --max-warnings 500

  integrity:
    name: Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Production Integrity Test
        run: npm run test:integrity

      - name: Media Integrity Test (if present)
        run: |
          if [ -f tests/media-integrity.test.js ]; then
            node tests/media-integrity.test.js
          else
            echo "No media-integrity.test.js – skipping"
          fi

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint, integrity]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Phone Verification Smoke Test
        run: node tests/phone-smoke.js

      - name: Build CSS
        run: |
          npm install -D tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./input.css -o ./style.css --minify
