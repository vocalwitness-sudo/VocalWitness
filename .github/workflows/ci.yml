name: CI Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - run: npm ci || npm install
      
      - name: Syntax check
        run: |
          if [ -f scripts/syntax-check.mjs ]; then node scripts/syntax-check.mjs
          else find js -name '*.js' -print0 | xargs -0 -n1 node --check
          fi
          
      - name: ESLint
        run: npx eslint js functions --no-error-on-unmatched-pattern
        
      - name: Integrity
        run: npm run test:integrity
        continue-on-error: true
