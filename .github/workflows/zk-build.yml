name: Build ZK Artifacts

on:
  push:
    paths:
      - 'witness.circom'
      - '.github/workflows/zk-build.yml'
  workflow_dispatch:

jobs:
  build-zk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants push permissions to GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Circom + Dependencies
        run: |
          curl -L https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64 -o circom
          chmod +x circom
          sudo mv circom /usr/local/bin/
          npm install -g snarkjs
          npm install circomlib

      - name: Compile Circuit
        run: |
          mkdir -p build circuits
          circom witness.circom --r1cs --wasm --sym -o build/ -l node_modules

      - name: Generate Keys
        run: |
          cd build
          wget -q https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_14.ptau
          snarkjs groth16 setup witness.r1cs powersOfTau28_hez_final_14.ptau witness_0000.zkey
          snarkjs zkey contribute witness_0000.zkey witness_final.zkey --name="VocalWitness" -v -e="$(openssl rand -hex 32)"
          snarkjs zkey export verificationkey witness_final.zkey verification_key.json

      - name: Place Artifacts
        run: |
          if [ -f build/witness_js/witness.wasm ]; then
            cp build/witness_js/witness.wasm circuits/
          else
            cp build/witness.wasm circuits/
          fi
          cp build/witness_final.zkey circuits/
          cp build/verification_key.json circuits/
          mkdir -p functions
          cp build/verification_key.json functions/

      - name: Commit Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add circuits/ functions/verification_key.json
          git commit -m "ci: add ZK circuit artifacts" || echo "No changes"
          git push
