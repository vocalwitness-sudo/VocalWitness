name: Build ZK Artifacts

on:
  push:
    paths:
      - 'witness.circom'
      - '.github/workflows/zk-build.yml'

jobs:
  build-zk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (Required for Circom)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Circom Compiler
        run: |
          git clone https://github.com/iden3/circom.git
          cd circom
          cargo build --release
          cargo install --path circom

      - name: Setup Node.js & SnarkJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SnarkJS
        run: npm install -g snarkjs

      - name: Compile Circom Circuit
        run: |
          mkdir -p build
          circom witness.circom --r1cs --wasm --sym -o build/

      - name: Setup Powers of Tau & Generate Proving Key (.zkey)
        run: |
          cd build
          # Download Powers of Tau file (adjust size 12 depending on constraints)
          wget https://hermez.s3-eu-west-1.amazonaws.com/powersOfTau28_hez_final_12.ptau
          
          # Circuit Setup
          snarkjs groth16 setup witness.r1cs powersOfTau28_hez_final_12.ptau witness_0000.zkey
          
          # Contribute random entropy for contribution
          snarkjs zkey contribute witness_0000.zkey witness_final.zkey --name="GitHub CI" -v -e="$(date +%s)"
          
          # Export Verification Key
          snarkjs zkey export verificationkey witness_final.zkey verification_key.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zk-build-assets
          path: |
            build/witness_js/witness.wasm
            build/witness_final.zkey
            build/verification_key.json
