name: Integrity & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f functions/package.json ]; then
            cd functions && npm install
          fi
          npm install --save-dev @firebase/rules-unit-testing firebase-tools

      - name: Run Firestore Rules & Integrity Tests
        run: |
          # Runs your integrity test suite against firestore.rules
          npx mocha tests/integrity-core.js
