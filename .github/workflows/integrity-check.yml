name: Integrity & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      # integrity-core.js is a standalone Node script, NOT a Mocha suite
      - name: Run integrity-core
        run: node tests/integrity-core.js

      - name: Run media-integrity (if present)
        run: |
          if [ -f tests/media-integrity.test.js ]; then
            node tests/media-integrity.test.js
          else
            echo "skip media-integrity"
          fi
