name: Sync package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Force-regenerate lockfiles
        run: |
          set -e
          rm -rf node_modules package-lock.json
          npm install --no-fund --no-audit
          if [ -f functions/package.json ]; then
            cd functions
            rm -rf node_modules package-lock.json
            npm install --no-fund --no-audit
            cd ..
          fi
          echo "=== root lock head ==="
          head -n 40 package-lock.json

      - name: Commit on branch and open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate package-lock.json"
          title: "chore: sync package-lock.json with package.json"
          body: |
            Regenerates root and functions lockfiles so `npm ci` works in CI/deploy.
          branch: chore/sync-package-lock
          delete-branch: true
