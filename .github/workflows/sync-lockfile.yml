name: Sync package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: |
          rm -rf node_modules
          npm install
          if [ -d "functions" ]; then
            cd functions
            rm -rf node_modules
            npm install
            cd ..
          fi

      - name: Commit and Push Lockfile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json || git add package-lock.json
          git diff --staged --quiet || (git commit -m "chore: sync package-lock.json with package.json" && git push)
