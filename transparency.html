<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="transparencyPageTitle">Transparency • VocalWitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/logo.png" type="image/png">
</head>
<body class="min-h-screen bg-[#0a0f1c] text-white pb-16">

<header class="sticky top-0 z-50 glass rounded-3xl p-4 mb-8 mx-4 mt-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl">🛡️</div>
            <h1 class="text-2xl font-bold" data-i18n="vocalWitnessBrand">VocalWitness</h1>
        </div>
        <a href="index.html" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl" data-i18n="backToSquare">← Back to Square</a>
    </div>
</header>

<div class="max-w-4xl mx-auto px-6" id="transparencyContent">
    <div class="text-center mb-12">
        <h2 class="text-4xl font-bold mb-3" data-i18n="transparencyDashboardTitle">Transparency Dashboard</h2>
        <p class="text-emerald-300" data-i18n="liveRealtimeSubtitle">Live • Updated in Real Time</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10" id="statsContainer">
        <!-- Populated by JS -->
    </div>

    <!-- Allocation -->
    <div class="glass rounded-3xl p-8 mb-10">
        <h3 class="text-xl font-semibold mb-6" data-i18n="fundAllocationTitle">Fund Allocation (This Month)</h3>
        <div id="allocationContainer" class="space-y-6">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="text-center text-xs text-zinc-500 mt-12">
        <span data-i18n="ledgerFetchNotice">Data is fetched live from our transparent ledger.</span><br>
        <span data-i18n="lastUpdatedPrefix">Last updated:</span> <span id="lastUpdated"></span>
    </div>
</div>

<script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    async function loadTransparencyData() {
        try {
            const contributionsRef = collection(db, "contributions");
            const snapshot = await getDocs(query(contributionsRef, orderBy("timestamp", "desc"), limit(50)));

            let totalUSD = 0;
            snapshot.forEach(doc => {
                totalUSD += doc.data().amountUSD || 0;
            });

            document.getElementById('statsContainer').innerHTML = `
                <div class="glass rounded-3xl p-6 text-center">
                    <div class="text-5xl font-bold text-emerald-400">$${totalUSD.toFixed(0)}</div>
                    <div class="text-sm text-zinc-400 mt-2" data-i18n="totalContributions">Total Contributions</div>
                </div>
                <div class="glass rounded-3xl p-6 text-center">
                    <div class="text-5xl font-bold">${snapshot.size}</div>
                    <div class="text-sm text-zinc-400 mt-2" data-i18n="activeSustainers">Active Sustainers</div>
                </div>
                <div class="glass rounded-3xl p-6 text-center">
                    <div class="text-5xl font-bold text-amber-400">94%</div>
                    <div class="text-sm text-zinc-400 mt-2" data-i18n="utilizationRate">Utilization Rate</div>
                </div>
            `;

            document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString();

        } catch (e) {
            console.error(e);
            document.getElementById('transparencyContent').innerHTML += `<p class="text-red-400 text-center mt-8" data-i18n="loadErrorNotice">Unable to load live data at the moment.</p>`;
        }
    }

    loadTransparencyData();
</script>

</body>
</html>
