<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <title>Live Arena • VocalWitness</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1c; }
    .glass {
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(14, 165, 233, 0.2);
    }
  </style>
</head>
<body class="min-h-screen text-white pb-24">

  <div class="max-w-5xl mx-auto px-4 pt-6">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3">
        <button id="backBtn" class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm font-medium transition">
          ← Back
        </button>
        <div>
          <h1 class="text-3xl font-bold text-sky-400 flex items-center gap-2">
            <span class="text-4xl">🏟️</span> Live Arena
          </h1>
          <p class="text-sm text-zinc-400">Real-time community reporting • Globe-wide</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right">
          <div class="text-xs text-zinc-400">Verified Citizens</div>
          <div class="font-mono text-sky-400 text-xl font-bold">
            <span id="verifiedCount">0</span><span class="text-zinc-500 text-base"> / 500</span>
          </div>
        </div>
        <button id="createRoomBtn"
                class="rounded-2xl bg-gradient-to-r from-sky-500 to-cyan-500 px-6 py-3.5 font-bold text-white shadow-lg shadow-sky-500/25 hover:from-sky-400 hover:to-cyan-400 active:scale-95 transition">
          + Start a Room
        </button>
      </div>
    </header>

    <!-- Soft Goal Progress -->
    <div class="glass rounded-2xl p-5 mb-8">
      <div class="flex justify-between text-sm mb-2">
        <span class="text-zinc-300">Community Goal – Unlock full global mega-stages</span>
        <span id="progressText" class="text-sky-400 font-medium">Loading…</span>
      </div>
      <div class="h-2.5 overflow-hidden rounded-full bg-zinc-800">
        <div id="verifiedProgress" class="h-full bg-gradient-to-r from-sky-500 to-cyan-400 transition-all duration-700" style="width: 0%"></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-semibold">Live Now</h2>
      <div class="flex gap-2 text-sm">
        <button class="px-3 py-1.5 rounded-lg bg-sky-500/20 text-sky-300 border border-sky-500/40">All</button>
        <button class="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-400 hover:bg-zinc-700">Near Me</button>
        <button class="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-400 hover:bg-zinc-700">My Circle</button>
      </div>
    </div>

    <!-- Rooms Grid -->
    <div id="liveRoomsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Injected by JS -->
      <div class="col-span-full py-20 text-center text-zinc-500">
        <div class="text-6xl mb-4">🌍</div>
        <p class="text-lg">Loading live rooms…</p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/live-arena.js"></script>
  <script type="module">
    // Back button
    document.getElementById('backBtn')?.addEventListener('click', () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = '/';
    });
  </script>
</body>
</html>
