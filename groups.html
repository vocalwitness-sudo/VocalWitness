<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups • VocalWitness</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./logo.png" type="image/png">
  <style>
    .glass {
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(16, 185, 129, 0.22);
    }

    /* Tab buttons */
    .tab-btn {
      background: transparent;
      color: #a1a1aa; /* zinc-400 */
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #e4e4e7; /* zinc-200 */
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: #10b981; /* emerald-500 */
      color: #000;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body class="min-h-screen bg-[#0a0f1c] pb-28 text-white">

  <div class="mx-auto max-w-3xl px-4 py-6">

    <!-- 1. Header (Now at the very top) -->
    <div class="glass mb-6 flex items-center justify-between rounded-3xl p-4">
      <div class="flex items-center gap-3">
        <a href="/" 
           class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-500/15 text-lg transition hover:bg-emerald-500/25">
          ←
        </a>
        <div>
          <h1 class="text-2xl font-bold text-emerald-400">Groups</h1>
          <p class="text-xs text-zinc-400">Truth communities & evidence circles</p>
        </div>
      </div>

      <!-- Create Group Button (Text color changed to white, non-black styling) -->
      <button type="button" id="openCreateModalBtn"
              class="flex items-center gap-2 rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white
                     shadow-[0_0_15px_rgba(16,185,129,0.3)] 
                     transition-all duration-200
                     hover:bg-emerald-500 
                     hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] 
                     active:scale-95">
        <span class="text-lg">➕</span>
        Create Group
      </button>
    </div>

    <!-- 2. Tabs + Language Selector -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex gap-1 rounded-2xl border border-zinc-800 bg-zinc-900/80 p-1.5 overflow-x-auto">
        <button type="button" 
                class="tab-btn active flex-1 min-w-[100px] rounded-xl px-5 py-2.5 text-sm" 
                data-tab="discover">
          Discover
        </button>
        <button type="button" 
                class="tab-btn flex-1 min-w-[100px] rounded-xl px-5 py-2.5 text-sm" 
                data-tab="my-groups">
          My Groups
        </button>
        <button type="button" 
                class="tab-btn flex-1 min-w-[100px] rounded-xl px-5 py-2.5 text-sm" 
                data-tab="trending">
          🔥 Trending
        </button>
      </div>

      <select id="languageSelector" 
              class="rounded-2xl border border-zinc-700 bg-zinc-900 px-4 py-2.5 text-sm text-white 
                     focus:border-emerald-500 focus:outline-none">
        <option value="en">English</option>
        <option value="pcm">Naija Pidgin</option>
        <option value="yo">Yorùbá</option>
        <option value="ha">Hausa</option>
        <option value="ig">Igbo</option>
        <option value="sw">Swahili</option>
      </select>
    </div>

    <!-- 3. Filters (Moved directly below tabs) -->
    <div class="mb-6 flex flex-wrap gap-2">
      <button class="rounded-full border border-emerald-500/40 bg-emerald-500/10 px-4 py-1.5 text-xs font-medium text-emerald-400">
        All
      </button>
      <button class="rounded-full border border-zinc-700 bg-zinc-800 px-4 py-1.5 text-xs text-zinc-300 hover:border-emerald-500/50">
        Public
      </button>
      <button class="rounded-full border border-zinc-700 bg-zinc-800 px-4 py-1.5 text-xs text-zinc-300 hover:border-emerald-500/50">
        Citizen Circle
      </button>
      <button class="rounded-full border border-zinc-700 bg-zinc-800 px-4 py-1.5 text-xs text-zinc-300 hover:border-cyan-500/50">
        Witness Circle
      </button>
    </div>

    <!-- 4. Search Bar -->
    <div class="relative mb-8">
      <input type="text" 
             id="searchInput" 
             placeholder="Search groups by name, topic or location..."
             class="w-full rounded-2xl border border-zinc-700 bg-zinc-900 px-5 py-4 pl-12 text-white placeholder-zinc-500 
                    focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500/50">
      
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-zinc-500" 
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>

    <!-- Groups List -->
    <div id="group-container" class="space-y-5"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden py-16 text-center">
      <div class="mb-4 text-5xl">🛡️</div>
      <h3 class="mb-2 text-xl font-semibold">No groups yet</h3>
      <p class="mx-auto max-w-xs text-sm text-zinc-400">Be the first to create a Truth Circle in your community.</p>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div id="groupModal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
    <div class="glass w-full max-w-md overflow-hidden rounded-3xl shadow-2xl">
      <div class="border-b border-zinc-700 p-6">
        <h2 class="text-xl font-bold">Create New Group</h2>
        <p class="mt-1 text-sm text-zinc-400">Build a Truth Circle for your community</p>
      </div>
      <div class="space-y-5 p-6">
        <div>
          <label class="mb-1.5 block text-sm text-zinc-400">Group Name *</label>
          <input id="groupName" type="text" maxlength="60"
                 class="w-full rounded-2xl border border-zinc-700 bg-zinc-900 px-4 py-3 focus:border-emerald-500 focus:outline-none"
                 placeholder="e.g. Lagos Truth Seekers">
        </div>
        <div>
          <label class="mb-1.5 block text-sm text-zinc-400">Description</label>
          <textarea id="groupDesc" rows="3" maxlength="280"
                    class="w-full resize-none rounded-2xl border border-zinc-700 bg-zinc-900 px-4 py-3 focus:border-emerald-500 focus:outline-none"
                    placeholder="What truth or cause does this group stand for?"></textarea>
        </div>
        <div>
          <label class="mb-1.5 block text-sm text-zinc-400">Visibility</label>
          <select id="groupVisibility" class="w-full rounded-2xl border border-zinc-700 bg-zinc-900 px-4 py-3 focus:border-emerald-500 focus:outline-none">
            <option value="public">🌍 Public – Anyone can discover & join</option>
            <option value="network">🔗 Network Only</option>
            <option value="citizen_circle">🛡️ Citizen Circle Only</option>
            <option value="witness_circle">🔐 Witness Circle Only (Highest Trust)</option>
          </select>
        </div>
        <div class="rounded-2xl border border-zinc-700 bg-zinc-900/70 p-4">
          <p class="mb-2 text-xs text-zinc-400">Every group includes:</p>
          <div class="flex flex-wrap gap-2 text-xs">
            <span class="rounded-full border border-emerald-500/20 bg-emerald-500/10 px-2.5 py-1 text-emerald-400">Evidence Locker</span>
            <span class="rounded-full border border-amber-500/20 bg-amber-500/10 px-2.5 py-1 text-amber-400">Attestation Wall</span>
            <span class="rounded-full border border-cyan-500/20 bg-cyan-500/10 px-2.5 py-1 text-cyan-400">Forensic Timeline</span>
          </div>
        </div>
      </div>
      <div class="flex gap-3 border-t border-zinc-700 p-6">
        <button type="button" id="closeCreateModalBtn" class="flex-1 rounded-2xl bg-zinc-800 py-3.5 text-sm font-medium hover:bg-zinc-700">Cancel</button>
        <button type="button" id="submitCreateGroupBtn" class="flex-1 rounded-2xl bg-emerald-600 py-3.5 text-sm font-semibold text-white hover:bg-emerald-500">Create Group</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initGroups } from './js/groups.js';
    import { initLanguage } from './js/i18n.js';

    document.addEventListener('DOMContentLoaded', () => {
      initLanguage();
      initGroups('group-container');
    });
  </script>
</body>
</html>
