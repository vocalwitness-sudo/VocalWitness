<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Use • VocalWitness</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1c; color: #e4e4e7; }
        .glass { background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(16, 185, 129, 0.25); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 pb-24">
    <div class="max-w-3xl mx-auto">

        <!-- Header -->
        <div class="flex items-center justify-between mb-10 glass rounded-3xl p-4">
            <div class="flex items-center gap-3">
                <a href="/" class="w-10 h-10 bg-emerald-500/20 rounded-2xl flex items-center justify-center text-xl hover:bg-emerald-500/30 transition" aria-label="Back">⬅️</a>
                <h1 class="text-2xl font-bold tracking-tight text-white">VocalWitness</h1>
            </div>
            <select id="languageSelector" class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <option value="en">🇬🇧 English</option>
                <option value="pcm">🇳🇬 Naija Pidgin</option>
                <option value="ha">🇳🇬 Hausa</option>
                <option value="yo">🇳🇬 Yorùbá</option>
                <option value="ig">🇳🇬 Igbo</option>
                <option value="sw">🇹🇿 Kiswahili</option>
                <option value="ar">🇸🇦 العربية</option>
                <option value="fr">🇫🇷 Français</option>
            </select>
        </div>

        <header class="mb-10">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tighter text-white mb-3">How to Use VocalWitness</h1>
            <p class="text-xl text-zinc-400">Simple steps to seal and share what you witnessed.</p>
        </header>

        <!-- PASTE THE HOW-TO-USE CONTENT HERE -->

        <!-- Footer links -->
        <div class="flex flex-wrap justify-center gap-4 text-sm text-zinc-400 mt-16 mb-10">
            <a href="/faq" class="hover:text-emerald-400">FAQ</a>
            <a href="/about" class="hover:text-emerald-400">About</a>
            <a href="/verify" class="hover:text-emerald-400">Verify</a>
            <a href="/transparency" class="hover:text-emerald-400">Transparency</a>
            <a href="/safety" class="hover:text-emerald-400">Safety</a>
            <a href="/privacy" class="hover:text-emerald-400">Privacy</a>
        </div>

    </div>

    <script type="module">
        import { initLanguage } from './js/i18n.js';
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initLanguage === 'function') initLanguage();
        });
    </script>
</body>
</html>
