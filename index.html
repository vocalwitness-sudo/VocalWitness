<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <meta name="description" content="VocalWitness - Privacy First Public Square for Truth and Evidence">

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: wss: blob: data:;
        script-src 'self' 
            https://cdn.jsdelivr.net
            https://www.gstatic.com 
            https://cdnjs.cloudflare.com 
            https://cdn.tailwindcss.com 
            https://apis.google.com 
            https://js.paystack.co 
            https://*.paystack.co 
            'unsafe-inline';
        style-src 'self' 'unsafe-inline' 
            https://cdn.tailwindcss.com 
            https://fonts.googleapis.com 
            https://paystack.com 
            https://*.paystack.co 
            https://*.paystack.net 
            https://js.paystack.co;
        font-src 'self' https://fonts.gstatic.com https: data:;
        connect-src 'self' 
            https://*.googleapis.com 
            https://*.firebaseio.com 
            https://firestore.googleapis.com 
            https://identitytoolkit.googleapis.com 
            https://securetoken.googleapis.com 
            https://api.paystack.co 
            https://*.paystack.co 
            https://*.paystack.com 
            https://*.supabase.co 
            https://*.cloudfunctions.net 
            wss://*.firebaseio.com;
        img-src 'self' https: data: blob:;
        media-src 'self' https: blob:;
        frame-src 'self' 
            https://accounts.google.com 
            https://*.firebaseapp.com 
            https://standard.paystack.co 
            https://checkout.paystack.com 
            https://*.paystack.co 
            https://*.paystack.com;
        object-src 'none';
        base-uri 'self';
        upgrade-insecure-requests;
    ">

    <title data-i18n="pageTitle">VocalWitness • Truth • Evidence • Public Square</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/logo.png" type="image/png">
</head>
<body class="bg-[#0a0f1c] text-white min-h-screen antialiased">

<div class="app-container py-6">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8 sticky top-4 z-50 glass rounded-3xl p-4 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center text-2xl shadow-md">VW</div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight" data-i18n="appTitle">VocalWitness</h1>
                <p class="text-xs sm:text-sm text-emerald-400 tracking-widest" data-i18n="appSubtitle">Truth • Evidence • Public Square</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 sm:gap-4">
            <select id="languageSelector" 
                    class="bg-zinc-900 border border-zinc-700 text-white rounded-2xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 hidden md:block">
            </select>
                
            <button onclick="toggleDarkMode()" class="p-2.5 sm:p-3 rounded-2xl hover:bg-zinc-800 transition" title="Toggle theme" data-i18n-title="toggleTheme">
                <span id="theme-icon">🌙</span>
            </button>

            <a href="privacy.html" class="hidden lg:flex items-center gap-1.5 text-emerald-400 hover:text-emerald-300 transition-colors text-sm font-medium px-3 py-2" data-i18n="privacyLink">
                Privacy First
            </a>

            <button id="support-btn" class="px-4 sm:px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black font-medium rounded-2xl transition whitespace-nowrap text-sm sm:text-base shadow-sm">
                Support The Square
            </button>

            <button id="guest-action-btn" 
                    class="px-4 sm:px-5 py-2.5 bg-white hover:bg-zinc-100 text-black font-semibold rounded-2xl transition flex items-center gap-2 shadow-sm text-sm sm:text-base min-w-[180px] justify-center">
                <img src="https://www.google.com/favicon.ico" 
                     class="w-4 h-4 flex-shrink-0" 
                     alt="Google"
                     width="16" 
                     height="16">
                <span class="hidden sm:inline" id="guest-btn-text" data-i18n="joinBtn">Join VocalWitness</span>
            </button>

            <button id="profile-btn" class="px-4 sm:px-5 py-2.5 border border-zinc-700 hover:bg-zinc-800 rounded-2xl transition flex items-center gap-2 hidden text-sm sm:text-base">
                Profile
            </button>
        </div>
    </header>

    <!-- Main Navigation -->
    <div class="relative z-40 mb-8">
        <nav class="flex gap-2 overflow-x-auto pb-2" id="main-nav">
            <button data-tab="square" class="nav-tab active px-5 py-3 rounded-3xl whitespace-nowrap flex flex-col items-center min-w-[150px] group relative">
                <span class="font-semibold"><span data-i18n="publicSquareTab">Public Square</span></span>
                <span class="text-xs text-zinc-400 hidden md:block" data-i18n="publicSquareDesc">Share stories & evidence</span>
            </button>
            
            <button data-tab="ledger" class="nav-tab px-5 py-3 rounded-3xl whitespace-nowrap flex flex-col items-center min-w-[150px] group relative">
                <span class="font-semibold"><span data-i18n="evidenceLedgerTab">Evidence Ledger</span></span>
                <span class="text-xs text-zinc-400 hidden md:block" data-i18n="evidenceLedgerDesc">Permanent record</span>
            </button>
            
            <button data-tab="arena" class="nav-tab px-5 py-3 rounded-3xl whitespace-nowrap flex flex-col items-center min-w-[150px] group relative">
                <span class="font-semibold"><span data-i18n="liveArenaTab">Live Arena</span></span>
                <span class="text-xs text-zinc-400 hidden md:block" data-i18n="liveArenaDesc">Watch & join live</span>
            </button>
            
            <button data-tab="mycircle" class="nav-tab px-5 py-3 rounded-3xl whitespace-nowrap flex flex-col items-center min-w-[150px] group relative">
                <span class="font-semibold"><span data-i18n="myCircleTab">My Circle</span></span>
                <span class="text-xs text-zinc-400 hidden md:block" data-i18n="myCircleDesc">Trusted people</span>
            </button>
            
            <button data-tab="witness" class="nav-tab px-5 py-3 rounded-3xl whitespace-nowrap flex flex-col items-center min-w-[150px] group relative bg-amber-900/70 text-amber-300 border border-amber-700">
                <span class="font-semibold"><span data-i18n="verifiedWitnessesTab">Verified Witnesses</span></span>
                <span class="text-xs text-amber-400 hidden md:block" data-i18n="verifiedWitnessesDesc">Trusted voices</span>
            </button>

            <div class="dropdown-container ml-auto">
                <button id="more-btn" class="nav-tab px-6 py-3 rounded-3xl whitespace-nowrap flex flex-col items-center min-w-[140px] bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-md" data-i18n="moreOptionsBtn">
                    More Options
                </button>

                <div id="more-menu" class="hidden bg-zinc-900 border border-zinc-700 rounded-3xl shadow-2xl py-3">
                    <a href="my-testimonies.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="myTestimoniesMenu">My Testimonies</a>
                    <a href="groups.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="groupsMenu">Groups</a>
                    <a href="true-witness.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="trueWitnessMenu">True Witness</a>
                    <div class="h-px bg-zinc-700 mx-4 my-2"></div>
                    <a href="about.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="aboutMenu">About Us</a>
                    <a href="privacy.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="privacyPolicyMenu">Privacy Policy</a>
                    <a href="terms.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="termsOfServiceMenu">Terms of Service</a>
                    <a href="safety.html" class="block px-6 py-3 hover:bg-zinc-800 text-sm" data-i18n="safetyGuidelinesMenu">Safety Guidelines</a>
                </div>
            </div>
        </nav>
    </div>

    <!-- Testimony Composer -->
    <div class="glass rounded-3xl p-5 sm:p-8 mb-10 shadow-xl">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                <span data-i18n="shareTestimonyTitle">Share Your Testimony</span>
            </h2>
            <span class="text-xs text-zinc-500" data-i18n="publicSquareSubtitle">Public Square</span>
        </div>

        <textarea id="mainInput" rows="4" 
                class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl p-4 sm:p-5 text-base sm:text-lg placeholder-zinc-500 focus:outline-none focus:border-emerald-500 resize-none" 
                placeholder="Share your raw testimony... What did you witness?" data-i18n-placeholder="mainInputPlaceholder"></textarea>
        
        <div class="flex flex-col sm:flex-row gap-3 mt-5">
            <button id="btn-photo" class="flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 hover:border-emerald-500 rounded-2xl flex items-center justify-center gap-3 font-medium transition-all active:scale-95 min-w-[260px]">
                <span class="inline" data-i18n="addPhotoEvidence">Add Photo Evidence</span>
            </button>

            <button id="btn-voice" class="flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 hover:border-emerald-500 rounded-2xl flex items-center justify-center gap-3 font-medium transition-all active:scale-95 min-w-[260px]">
                <span class="inline" data-i18n="recordVoiceMessage">Record Voice Message</span>
            </button>
        </div>

        <div id="preview-area" class="mt-6 min-h-[120px] border border-dashed border-zinc-700 rounded-2xl p-4 flex items-center justify-center text-zinc-500 text-sm" data-i18n="previewAreaText">
            Preview will appear here...
        </div>

        <button id="postButton" class="mt-8 w-full py-5 sm:py-6 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-500 hover:from-emerald-600 hover:via-teal-600 hover:to-emerald-600 text-black font-bold text-lg sm:text-xl rounded-3xl transition-all active:scale-[0.97] relative overflow-hidden group shadow-lg">
            <span class="relative z-10 flex items-center justify-center gap-3" data-i18n="postButton">Publish to the Square</span>
        </button>
    </div>

    <main id="main-content" class="mb-12">
        <div id="feedContainer" class="space-y-8"></div>
    </main>

    <!-- Modals and Footer (unchanged) -->
    <!-- Profile Modal, Support Modal, Login Modal, Create Account Modal, Footer remain the same as your previous version -->

    <footer class="bg-zinc-950 border-t border-zinc-800 pt-16 pb-12 mt-20 rounded-3xl">
        <div class="max-w-6xl mx-auto px-6 text-center text-xs text-zinc-500">
            © 2026 VocalWitness • Built for Truth • Powered by Citizens
        </div>
    </footer>
</div>

<!-- Scripts (kept same as your last version) -->

    // ... your existing script logic ...
</script>

<script src="https://js.paystack.co/v2/inline.js" crossorigin="anonymous"></script>
<script type="module" src="js/main.js"></script>

<script type="module">
    import { initLanguage } from './js/i18n.js';
    document.addEventListener('DOMContentLoaded', () => initLanguage());
</script>

</body>
</html>
