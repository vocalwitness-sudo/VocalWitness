<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocalWitness - Citizen Reporting & Real Evidence</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#0a0f1c',
            cardBg: '#111827',
            borderDark: '#27272a',
            accentEmerald: '#10b981'
          }
        }
      }
    }
  </script>

  <!-- Core Stylesheet / Input CSS -->
  <link rel="stylesheet" href="./input.css">

  <style>
    :root {
      --header-height-mobile: 102px;
      --header-height-desktop: 72px;
    }

    html, body {
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0f1c;
      color: #ffffff;
      padding-top: var(--header-height-mobile);
    }

    @media (min-width: 768px) {
      body {
        padding-top: var(--header-height-desktop);
      }
    }

    #main-header {
      background-color: #09090b;
      border-bottom: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>

  <!-- External Libraries & Cryptographic/Payment Dependencies -->
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
  <script src="https://js.paystack.co/v2/inline.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/snarkjs@0.7.0/build/snarkjs.min.js" defer></script>
</head>
<body class="bg-darkBg text-white antialiased min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header id="main-header" class="fixed top-0 left-0 right-0 z-50 h-[var(--header-height-mobile)] md:h-[var(--header-height-desktop)] flex items-center px-4 shadow-lg">
    <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="#citizen-talk" class="text-2xl font-bold tracking-wider text-emerald-400">VocalWitness</a>
      </div>
      <!-- Navigation / Controls mount point -->
      <div id="header-controls" class="flex items-center space-x-4"></div>
    </div>
  </header>

  <!-- Main Application Body Container -->
  <main id="app" class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
    <!-- Dynamic views (Witness Voice, Citizen Talk, DAO, etc.) mount here via router.js -->
  </main>

  <!-- Footer Section -->
  <footer class="bg-[#09090b] border-t border-zinc-800 py-6 text-center text-sm text-zinc-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p>&copy; 2026 VocalWitness. Decentralized Media Testimony Logging.</p>
      <div class="flex space-x-6">
        <a href="terms.html" class="hover:text-emerald-400">Terms</a>
        <a href="privacy.html" class="hover:text-emerald-400">Privacy</a>
        <a href="transparency.html" class="hover:text-emerald-400">Transparency</a>
      </div>
    </div>
  </footer>

  <!-- Application Entry Point Script -->
  <script type="module" src="./js/main.js?v=2.1"></script>
</body>
</html>
