  <!-- Critical Styles -->
  <style>
    :root {
      --header-height-mobile: 102px;
      --header-height-desktop: 64px;
    }

    body {
      background-color: #0a0f1c !important;
      color: #ffffff !important;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    .glass {
      background-color: #111827 !important;
      border: 1px solid rgba(16, 185, 129, 0.22) !important;
    }

    #main-nav button.nav-tab.active {
      background-color: #10b981 !important;
      color: #000000 !important;
      font-weight: 700;
    }

    /* Header height control */
    #main-content {
      padding-top: var(--header-height-mobile);
    }

    @media (min-width: 768px) {
      #main-content {
        padding-top: var(--header-height-desktop);
      }
    }

    /* Fallback for older browsers */
    @supports not (color: rgb(0 0 0 / 0.5)) {
      .bg-zinc-950 { background-color: #09090b !important; }
      .bg-zinc-900 { background-color: #18181b !important; }
      .bg-zinc-800 { background-color: #27272a !important; }
      .border-zinc-800 { border-color: #27272a !important; }
      .border-zinc-700 { border-color: #3f3f46 !important; }
      .text-zinc-400 { color: #a1a1aa !important; }
      .text-emerald-400 { color: #34d399 !important; }
      .glass { background-color: #111827 !important; }
    }
  </style>

<body class="bg-zinc-950 text-white antialiased">
  

  <!-- ====================== HEADER ====================== -->

<header id="main-header" class="fixed top-0 left-0 right-0 z-50 bg-zinc-950/95 backdrop-blur-md border-b border-emerald-500/30 shadow-lg">
  <div class="max-w-6xl mx-auto px-3 sm:px-4">

    <!-- ========== DESKTOP HEADER ========== -->
    <div class="hidden md:flex items-center justify-between h-[72px] gap-4">
      
    <!-- Brand -->
<a href="/" class="flex items-center gap-3 shrink-0 group" aria-label="VocalWitness Home">
  <div class="relative flex items-center justify-center">
    <div class="absolute -inset-1 bg-gradient-to-r from-emerald-500 to-teal-400 rounded-2xl blur-md opacity-40 group-hover:opacity-80 transition duration-300"></div>
    
    <img src="./logo.png" 
         alt="VocalWitness" 
         class="relative w-11 h-11 rounded-2xl border border-emerald-400/50 object-cover shadow-lg bg-zinc-900">
  </div>

  <div class="leading-tight">
    <h1 class="text-2xl font-black tracking-tight text-emerald-400 group-hover:text-emerald-300 transition" data-i18n="appTitle">
      VocalWitness
    </h1>
    <p class="text-[12px] font-bold tracking-wide text-emerald-300/90" data-i18n="appSubtitle">
      Truth • Evidence • Public Square
    </p>
  </div>
</a>

      <!-- Desktop Actions -->
      <div class="flex items-center gap-2 shrink-0">
        <select id="languageSelect" aria-label="Language"
                class="h-9 bg-zinc-900 border border-zinc-700 text-zinc-100 rounded-xl px-3 text-xs font-medium focus:outline-none focus:border-emerald-500">
          <option value="en" selected>English</option>
          <option value="pcm">Naija Pidgin</option>
          <option value="ha">Hausa</option>
          <option value="yo">Yorùbá</option>
          <option value="ig">Igbo</option>
          <option value="sw">Swahili</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="ar">العربية</option>
        </select>

        <button id="openSupportModalBtn" type="button"
        class="h-9 px-4 bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 font-bold rounded-xl text-xs transition border border-emerald-500 hover:border-emerald-400 shadow-md shadow-emerald-950/50"
        data-i18n="supportBtn">
  Support The Square
</button>

        <button id="openAuthModalBtn" type="button"
                class="h-9 px-4 bg-white hover:bg-zinc-100 text-zinc-900 font-bold rounded-xl text-xs flex items-center gap-1.5 border border-zinc-200">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-3.5 h-3.5" alt="">
          <span data-i18n="joinBtn">Join VocalWitness</span>
        </button>

        <button id="userProfileBtn" type="button"
                class="hidden h-9 px-4 bg-zinc-900 border border-zinc-700 text-emerald-400 font-bold rounded-xl text-xs flex items-center gap-1.5">
          <img id="user-avatar-desktop" src="" alt="" class="w-4 h-4 rounded-full object-cover hidden">
          <span id="default-avatar-icon-desktop">👤</span>
          <span id="user-name-desktop" data-i18n="profileBtn">My Profile</span>
        </button>

        <button id="data-saver-btn" type="button" onclick="toggleDataSaver()"
                class="h-9 px-3 bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white rounded-xl text-xs font-semibold flex items-center gap-1.5">
          <span>⚡</span>
          <span class="hidden xl:inline">Data Saver: <strong id="data-saver-status" class="text-emerald-400">Off</strong></span>
        </button>

        <button id="bookmarks-nav-btn" type="button" aria-label="Saved Items"
                class="h-9 w-9 bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white hover:border-emerald-500/50 rounded-xl flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
          </svg>
        </button>

        <div class="relative" id="notification-container">
          <button id="notification-btn" type="button" aria-label="Notifications"
                  class="relative h-9 w-9 bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white hover:border-emerald-500/50 rounded-xl flex items-center justify-center"
                  onclick="toggleNotificationDropdown(event)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span id="notification-badge" class="hidden absolute -top-1 -right-1 bg-emerald-500 text-black text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">0</span>
          </button>

          <!-- Notification Dropdown -->
          <div id="notification-dropdown"
               class="hidden absolute right-0 top-full mt-2 w-80 max-h-96 overflow-y-auto bg-zinc-900/95 backdrop-blur-xl border border-zinc-700 rounded-2xl shadow-2xl z-50">
            <div class="sticky top-0 bg-zinc-900/95 border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
              <h3 class="text-sm font-bold text-white">Notifications</h3>
              <span id="notification-count-tag" class="text-[11px] text-emerald-400 font-medium">0 new</span>
            </div>
            <div id="notification-list">
              <div class="p-8 text-center text-zinc-500">
                <p class="text-2xl mb-1">🔔</p>
                <p class="text-sm">No notifications yet</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    <!-- ========== MOBILE HEADER ========== -->

        <div class="flex items-center gap-1.5">

          <button id="userProfileBtnMobile" type="button"

        </div>
      </div>

      <!-- ROW 2: Quick Actions -->
      <div class="flex items-center justify-between gap-2 pt-1.5 border-t border-zinc-800/70">
        <div class="flex items-center gap-1.5">
          <select id="languageSelectMobile" aria-label="Language"
                  class="h-8 bg-zinc-900 border border-zinc-700 text-zinc-100 rounded-lg px-2 text-[11px] font-medium focus:outline-none focus:border-emerald-500">

            <option value="pcm">PCM</option>
            <option value="ha">HA</option>
            <option value="yo">YO</option>
            <option value="ig">IG</option>
            <option value="sw">SW</option>
            <option value="fr">FR</option>
            <option value="es">ES</option>
            <option value="pt">PT</option>
            <option value="ar">AR</option>
          </select>

         <button id="openSupportModalBtnMobile" type="button"
        class="h-8 px-2.5 bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 font-bold rounded-lg text-[11px] transition border border-emerald-500 hover:border-emerald-400 shadow-md shadow-emerald-950/50"
        data-i18n="supportBtn">
  Support
</button>

          <button id="data-saver-btn-mobile" type="button" onclick="toggleDataSaver()"
                  class="h-8 w-8 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg flex items-center justify-center text-sm">
            ⚡
          </button>
        </div>

        <div class="flex items-center gap-1">
          <button id="bookmarks-nav-btn-mobile" type="button" aria-label="Saved"
                  class="h-8 w-8 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg flex items-center justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          </button>

          <div class="relative">
            <button id="notification-btn-mobile" type="button" aria-label="Notifications"
                    class="relative h-8 w-8 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg flex items-center justify-center"
                    onclick="toggleNotificationDropdown(event)">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
              <span id="notification-badge-mobile" class="hidden absolute -top-0.5 -right-0.5 bg-emerald-500 text-black text-[8px] font-bold px-1 rounded-full min-w-[14px] text-center">0</span>
            </button>
          </div>

          <a href="/privacy" class="h-8 px-2 flex items-center text-[11px] font-medium text-emerald-400/90 hover:text-emerald-300">
            Privacy
          </a>
        </div>
      </div>
